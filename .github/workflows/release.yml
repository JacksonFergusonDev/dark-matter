name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs in parallel with builds; nothing publishes unless checks pass.
  checks:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  verify:
    name: Verify version & generate notes
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git-cliff needs the full history and tags to find this release's commits.
          fetch-depth: 0

      - name: Extract and verify version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read version from Cargo.toml"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" != "v${version}" ]]; then
            echo "::error::Tag ${REF_NAME} does not match Cargo.toml version v${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install uv (for git-cliff)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Generate release notes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            uvx git-cliff@2.14.2 --latest --strip all --output RELEASE_NOTES.md
          else
            uvx git-cliff@2.14.2 --unreleased --strip all --output RELEASE_NOTES.md
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  # Fan out all 6 OS x Arch native binary builds in parallel alongside CI.
  build-binaries:
    name: Build binary / ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
          - platform: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""
            archive: tar.gz
          - platform: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - platform: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - platform: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip
          - platform: Windows arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            ext: ".exe"
            archive: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0-${{ matrix.target }}

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Smoke-check and package archive
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          ARCHIVE_FMT: ${{ matrix.archive }}
        run: |
          bin="target/${TARGET}/release/dark-matter${EXT}"
          "$bin" --version | grep -F "$VERSION"

          mkdir -p dist-bin
          if [[ "$ARCHIVE_FMT" == "tar.gz" ]]; then
            archive="dark-matter-v${VERSION}-${TARGET}.tar.gz"
            tar -czf "dist-bin/${archive}" -C "target/${TARGET}/release" "dark-matter${EXT}"
          else
            archive="dark-matter-v${VERSION}-${TARGET}.zip"
            pwsh -NoProfile -Command "Compress-Archive -Path '${bin}' -DestinationPath 'dist-bin/${archive}'"
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist-bin && sha256sum "${archive}" > "${archive}.sha256")
          else
            (cd dist-bin && shasum -a 256 "${archive}" > "${archive}.sha256")
          fi

      - name: Upload binary archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist-bin/*
          if-no-files-found: error

  # Fan out all 6 OS x Arch PyPI wheels in parallel via maturin.
  build-wheels:
    name: Build PyPI wheel / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            manylinux: off
          - platform: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: off
          - platform: Linux x64
            os: ubuntu-24.04
            target: x86_64
            manylinux: auto
          - platform: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
          - platform: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: off
          - platform: Windows arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            manylinux: off

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build wheel with maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  build-sdist:
    name: Build PyPI sdist
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build sdist with maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish wheels to PyPI
    needs: [checks, build-wheels, build-sdist]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Attest PyPI distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  github-release:
    name: Create GitHub Release
    needs: [verify, checks, build-binaries, publish-pypi]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: .

      - name: Download binary archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: release-assets
          merge-multiple: true

      - name: Attest binary archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release-assets/*.{tar.gz,zip}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-assets/* --verify-tag --title "$TAG" --notes-file RELEASE_NOTES.md

  # Renders Formula/dark-matter.rb from the 4 Unix binary checksums.
  # On a real tag push it pushes to JacksonFergusonDev/homebrew-tap;
  # on a workflow_dispatch dry run it uploads the rendered formula as an artifact.
  sync-homebrew:
    name: Update Homebrew formula
    needs: [verify, build-binaries, github-release]
    if: ${{ !failure() && !cancelled() && (github.event_name != 'push' || needs.github-release.result == 'success') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions: {}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      DRY_RUN: ${{ github.event_name != 'push' }}
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: Download Unix binary checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: ${{ runner.temp }}/bin
          merge-multiple: true

      - name: Render Formula/dark-matter.rb
        run: |
          read_sha() {
            local file="${RUNNER_TEMP}/bin/dark-matter-v${VERSION}-${1}.tar.gz.sha256"
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing checksum file: ${file}"
              exit 1
            fi
            awk '{ print $1 }' "$file"
          }

          sha_darwin_arm64="$(read_sha aarch64-apple-darwin)"
          sha_darwin_x64="$(read_sha x86_64-apple-darwin)"
          sha_linux_arm64="$(read_sha aarch64-unknown-linux-gnu)"
          sha_linux_x64="$(read_sha x86_64-unknown-linux-gnu)"

          mkdir -p "${RUNNER_TEMP}/formula"
          cat > "${RUNNER_TEMP}/formula/dark-matter.rb" <<EOF
          # Written by dark-matter's release workflow (.github/workflows/release.yml).
          # Edit the template there, not this file.
          class DarkMatter < Formula
            desc "Dependency-graph-aware storage profiler for Homebrew"
            homepage "https://github.com/JacksonFergusonDev/dark-matter"
            version "${VERSION}"
            license "MIT"

            head do
              url "https://github.com/JacksonFergusonDev/dark-matter.git", branch: "main"
              depends_on "rust" => :build
            end

            on_macos do
              on_arm do
                url "https://github.com/JacksonFergusonDev/dark-matter/releases/download/v${VERSION}/dark-matter-v${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${sha_darwin_arm64}"
              end
              on_intel do
                url "https://github.com/JacksonFergusonDev/dark-matter/releases/download/v${VERSION}/dark-matter-v${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${sha_darwin_x64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/JacksonFergusonDev/dark-matter/releases/download/v${VERSION}/dark-matter-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${sha_linux_arm64}"
              end
              on_intel do
                url "https://github.com/JacksonFergusonDev/dark-matter/releases/download/v${VERSION}/dark-matter-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${sha_linux_x64}"
              end
            end

            def install
              if build.head?
                system "cargo", "install", *std_cargo_args
              else
                bin.install "dark-matter"
              end
            end

            test do
              assert_match(/^dark-matter version \d+\.\d+\.\d+/, shell_output("#{bin}/dark-matter --version"))
            end
          end
          EOF
          cat "${RUNNER_TEMP}/formula/dark-matter.rb"

      - name: Upload dry-run formula artifact
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-formula
          path: ${{ runner.temp }}/formula/dark-matter.rb
          if-no-files-found: error

      - name: Warn when TAP_GITHUB_TOKEN is unset
        if: env.DRY_RUN != 'true' && env.TAP_TOKEN == ''
        run: echo "::warning::TAP_GITHUB_TOKEN isn't set, so the Homebrew formula wasn't updated."

      - name: Checkout homebrew-tap
        if: env.DRY_RUN != 'true' && env.TAP_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JacksonFergusonDev/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap
          persist-credentials: true # zizmor: ignore[artipacked] the push below needs it; nothing uploads this checkout.

      - name: Push updated formula to homebrew-tap
        if: env.DRY_RUN != 'true' && env.TAP_TOKEN != ''
        run: |
          cp "${RUNNER_TEMP}/formula/dark-matter.rb" tap/Formula/dark-matter.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dark-matter.rb
          git diff --cached --quiet && exit 0
          git commit -m "feat(dark-matter): update to ${VERSION}"
          git push
