name: CI

on:
  push:
    branches: [ "main" ]
  # Run on PRs targeting any branch so stacked PRs are checked too.
  pull_request:
  # Lets the release workflow run the same checks before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --locked

    - name: Run Ruff Linter
      run: uv run ruff check --output-format=github .

    - name: Run Ruff Formatter
      run: uv run ruff format --check --output-format=github .

    - name: Lint Markdown with rumdl
      run: uv run rumdl check --output-format github .

    - name: Check Markdown formatting with rumdl
      run: uv run rumdl fmt --check --output-format github .

    - name: Type check with Mypy
      run: uv run mypy .

  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --locked

    - name: Run tests with coverage
      run: uv run pytest --cov

  smoke:
    name: Smoke test against Homebrew
    runs-on: macos-latest
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        python-version: "3.14"

    - name: Install dependencies
      run: uv sync --locked

    # A small formula with one dependency, so attribution has a graph to walk.
    - name: Install a test formula
      run: brew install watch

    - name: Run installed-mode commands
      run: |
        uv run dark-matter --verbose analyze --top 5
        uv run dark-matter inspect watch
        uv run dark-matter explain watch --tree
        uv run dark-matter reclaim watch
        uv run dark-matter orphans
        uv run dark-matter cleanup
        uv run dark-matter export --format json > export.json

    - name: Check the export
      run: uv run python scripts/smoke_check.py export.json watch ncurses

    - name: Run catalog-mode commands
      run: |
        uv run dark-matter inspect watch --source catalog
        uv run dark-matter explain watch --source catalog
