name: CI

on:
  push:
    branches: [ "main" ]
  # Run on PRs targeting any branch so stacked PRs are checked too.
  pull_request:
  # Lets the release workflow run the same checks before publishing.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install uv (for rumdl)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Lint Markdown with rumdl
        run: uvx rumdl check --output-format github .

      - name: Check Markdown formatting with rumdl
        run: uvx rumdl fmt --check --output-format github .

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit and integration tests
        run: cargo test --all-targets

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests with coverage floor
        run: cargo llvm-cov --all-targets --fail-under-lines 85

  smoke:
    name: Smoke test against Homebrew
    runs-on: macos-latest
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      # A small formula with one dependency, so attribution has a graph to walk.
      - name: Install a test formula
        run: brew install watch

      - name: Run installed-mode commands
        run: |
          ./target/release/dark-matter --verbose analyze --top 5
          ./target/release/dark-matter inspect watch
          ./target/release/dark-matter explain watch --tree
          ./target/release/dark-matter reclaim watch
          ./target/release/dark-matter orphans
          ./target/release/dark-matter cleanup
          ./target/release/dark-matter export --format json > export.json

      - name: Check the export
        env:
          SMOKE_EXPORT_JSON: export.json
          SMOKE_PACKAGE: watch
          SMOKE_DEPENDENCY: ncurses
        run: cargo test --test smoke -- --ignored

      - name: Run catalog-mode commands
        run: |
          ./target/release/dark-matter inspect watch --source catalog
          ./target/release/dark-matter explain watch --source catalog
