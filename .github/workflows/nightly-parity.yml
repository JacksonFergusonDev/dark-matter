name: Nightly Homebrew Parity

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-parity
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  parity:
    name: Parity on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: parity-${{ matrix.os }}
          cache-on-failure: true
          cache-all-crates: true

      - name: Ensure Homebrew is on PATH (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          else
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          fi

      - name: Install representative formulae and casks
        run: |
          brew update
          brew install watch jq
          if [ "$(uname -s)" = "Darwin" ]; then
            brew install --cask font-jetbrains-mono
          fi

      - name: Run native vs brew-cli parity suite
        id: parity
        continue-on-error: true
        run: cargo test --locked --test parity -- --ignored --nocapture

      - name: Report drift issue on scheduled failure
        if: steps.parity.outcome == 'failure' && github.event_name == 'schedule'
        env:
          MATRIX_OS: ${{ matrix.os }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const os = process.env.MATRIX_OS;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Homebrew receipt parity drift detected on ${os}`;
            const body = [
              `The nightly parity check comparing \`dark-matter\`'s direct receipt reader against \`brew info --json=v2 --installed\` failed on **${os}**.`,
              "",
              `Workflow run: ${runUrl}`,
              "",
              "Users remain unaffected when fallback triggers, or via `DARK_MATTER_USE_BREW_CLI=1`, until the receipt reader is updated."
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "homebrew-drift",
            });
            const match = existing.data.find((i) => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["homebrew-drift"],
              });
            }

      - name: Fail job if parity check failed
        if: steps.parity.outcome == 'failure'
        run: exit 1
