[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "dark-matter-cli"
dynamic = ["version"]
description = "A dependency-graph-aware storage profiler for Homebrew."
readme = "README.md"
authors = [{ name = "Jackson Ferguson", email = "jackson.ferguson0@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Repository = "https://github.com/jacksonfergusondev/dark-matter"
Issues = "https://github.com/jacksonfergusondev/dark-matter/issues"
PyPI = "https://pypi.org/project/dark-matter-cli/"
Author = "https://jacksonferguson.me"

[tool.maturin]
bindings = "bin"
strip = true
