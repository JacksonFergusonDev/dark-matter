[package]
name = "dark-matter"
version = "0.2.2"
edition = "2024"
description = "A dependency-graph-aware storage profiler for Homebrew."
readme = "README.md"
license = "MIT"
authors = ["Jackson Ferguson <jackson.ferguson0@gmail.com>"]
repository = "https://github.com/jacksonfergusondev/dark-matter"
homepage = "https://github.com/jacksonfergusondev/dark-matter"
keywords = ["homebrew", "cli", "disk-usage", "dependency-graph", "storage"]
categories = ["command-line-utilities"]

[[bin]]
name = "dark-matter"
path = "src/main.rs"

[dependencies]
ahash = "0.8"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
comfy-table = "7.1"
csv = "1.3"
dirs = "6.0"
env_logger = "0.11"
indexmap = { version = "2.7", features = ["serde"] }
indicatif = "0.17"
log = "0.4"
owo-colors = { version = "4.2", features = ["supports-colors"] }
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sonic-rs = "0.5"
tempfile = "3.15"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
proptest = "1.6"

[profile.release]
lto = true
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
